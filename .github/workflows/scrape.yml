name: MOPS_Data_Auto_Scraper

on:
  schedule:
    - cron: '30 23,13 * * *' # 台北时间 07:30 和 21:30 自动执行
  push:
    branches: [ main ]
  workflow_dispatch: # 允许你手动点击按钮运行

jobs:
  run_scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检查代码
        uses: actions/checkout@v3

      - name: 安装 Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: 安装依赖包
        run: npm install axios

      - name: 执行抓取脚本
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/crawler.js

      - name: 将数据存回仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/*.json
          git commit -m "自动更新数据: $(date)" || echo "没有数据更新"
          git push

  send-notification:
    needs: run_scraper
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send Telegram notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            📋 MOPS 数据抓取完成
            Repository: ${{ github.repository }}
            Job: ${{ needs.run_scraper.result }}
            Run: ${{ github.run_id }}
            Time: ${{ github.event.head_commit.timestamp || '手动触发' }}
