name: MOPS_Data_Auto_Scraper

on:
  schedule:
    # 台北时间 19:00 = UTC 11:00; 台北 23:00 = UTC 15:00
    # MOPS 公告通常在 18:00~20:00 台北时间发布，确保两个时间点都能抓到数据
    - cron: '0 11 * * *'
    - cron: '0 15 * * *'
  push:
    branches: [ main ]
  workflow_dispatch: # 允许你手动点击按钮运行

concurrency:
  group: mops-scrape
  cancel-in-progress: false

jobs:
  run_scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检查代码
        uses: actions/checkout@v3

      - name: 安装 Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: 安装依赖包
        run: npm install axios

      - name: 执行抓取脚本
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/crawler.js

      - name: 将数据存回仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git commit -m "自动更新数据: $(date)" || echo "没有数据更新"
          git pull --rebase origin main || echo "rebase 失败,跳过"
          git push
