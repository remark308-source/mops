<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>MOPS 股市監控看板</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { color: #1a73e8; border-left: 5px solid #1a73e8; padding-left: 15px; }
        .section { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .ann-item { border-bottom: 1px solid #eee; padding: 15px 0; }
        .ann-item:last-child { border-bottom: none; }
        .ann-header { font-weight: bold; color: #d93025; margin-bottom: 5px; }
        .ann-subject { font-size: 1.1em; line-height: 1.4; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #f8f9fa; color: #5f6368; padding: 12px; text-align: left; border-bottom: 2px solid #dee2e6; }
        /* 排序表頭樣式 */
        th.sortable { cursor: pointer; user-select: none; position: relative; transition: background 0.2s; }
        th.sortable:hover { background: #edf2ff; color: #1a73e8; }
        th.sortable::after { content: ' ↕'; opacity: 0.3; font-size: 0.8em; }
        
        td { padding: 12px; border-bottom: 1px solid #eee; }
        .loading { text-align: center; color: #888; padding: 20px; }
        .positive { color: #d93025; font-weight: bold; }
        .negative { color: #188038; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>今日重大公告</h1>
        <div id="ann-list" class="section"><div class="loading">正在讀取最新公告...</div></div>

        <h1>營收統計概覽</h1>
        <div class="section">
            <table id="rev-table">
                <thead>
                    <tr>
                        <th>公司名稱</th>
                        <th>公司代號</th>
                        <th>營收數據</th>
                        <th id="sort-growth" class="sortable">增減率</th>
                    </tr>
                </thead>
                <tbody id="rev-body">
                    <tr><td colspan="4" class="loading">正在讀取營收資料...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let revenueData = [];
        let sortAsc = false; // 預設降冪排序

        // 讀取公告
        fetch('./data/announcements.json')
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById('ann-list');
                if (!data || data.length === 0) { list.innerHTML = '今日暫無符合關鍵字的重大公告'; return; }
                list.innerHTML = data.map(i => `
                    <div class="ann-item">
                        <div class="ann-header">[${i.id}] ${i.name} - ${i.date}</div>
                        <div class="ann-subject">${i.subject}</div>
                    </div>
                `).join('');
            }).catch(() => document.getElementById('ann-list').innerHTML = '資料讀取失敗');

        // 渲染營收表格的函數
        function renderTable(data) {
            const tbody = document.getElementById('rev-body');
            tbody.innerHTML = data.map(i => {
                const growthVal = parseFloat(i.growth);
                const colorClass = growthVal > 0 ? 'positive' : (growthVal < 0 ? 'negative' : '');
                return `
                    <tr>
                        <td>${i.name}</td>
                        <td>${i.id}</td>
                        <td>${i.revenue}</td>
                        <td class="${colorClass}">${i.growth}</td>
                    </tr>
                `;
            }).join('');
        }

        // 讀取營收資料
        fetch('./data/revenue.json')
            .then(res => res.json())
            .then(data => {
                revenueData = data;
                renderTable(revenueData);
            }).catch(() => document.getElementById('rev-body').innerHTML = '<tr><td colspan="4">資料讀取失敗</td></tr>');

        // 排序邏輯
        document.getElementById('sort-growth').addEventListener('click', function() {
            sortAsc = !sortAsc;
            this.innerText = '增減率 ' + (sortAsc ? '↑' : '↓');
            
            const sorted = [...revenueData].sort((a, b) => {
                const valA = parseFloat(a.growth) || 0;
                const valB = parseFloat(b.growth) || 0;
                return sortAsc ? valA - valB : valB - valA;
            });
            
            renderTable(sorted);
        });
    </script>
</body>
</html>
